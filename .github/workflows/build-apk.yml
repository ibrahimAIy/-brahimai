name: Build NOXARA Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply NOXARA compatibility branding
        shell: bash
        run: |
          grep -RIl --exclude-dir=build -e 'İbrahim AI' -e 'Ibrahim AI' -e 'IbrahimAI' app/src/main | while read -r file; do
            sed -i 's/İbrahim AI/NOXARA/g; s/Ibrahim AI/NOXARA/g; s/IbrahimAI/NOXARA/g' "$file"
          done
          if grep -RIn --exclude-dir=build -e 'İbrahim AI' -e 'Ibrahim AI' -e 'IbrahimAI' app/src/main; then
            echo 'Old visible brand text remains in Android sources.'
            exit 1
          fi
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ibrahim-ai-debug-keystore-v1
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare direct-download APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NOXARA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NOXARA-Android-debug-apk
          path: NOXARA.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view native-latest >/dev/null 2>&1; then
            gh release upload native-latest NOXARA.apk --clobber
            gh release edit native-latest --title "NOXARA Android - Latest" --notes "En güncel NOXARA Android test APK'sı. Aynı paket kimliği korunur; önceki native sürümün üzerine güncellenebilir. Kaynak commit: $GITHUB_SHA" --latest
          else
            gh release create native-latest NOXARA.apk --title "NOXARA Android - Latest" --notes "En güncel NOXARA Android test APK'sı. Aynı paket kimliği korunur; önceki native sürümün üzerine güncellenebilir. Kaynak commit: $GITHUB_SHA" --latest
          fi
