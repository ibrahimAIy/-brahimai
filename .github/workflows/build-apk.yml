name: Build Ibrahim AI Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, browser-pairing-ready ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ibrahim-ai-debug-keystore-v1
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare direct-download APK
        run: cp app/build/outputs/apk/debug/app-debug.apk IbrahimAI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IbrahimAI-Native-debug-apk
          path: IbrahimAI.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view native-latest >/dev/null 2>&1; then
            gh release upload native-latest IbrahimAI.apk --clobber
            gh release edit native-latest --title "İbrahim AI Native - Latest" --notes "Otomatik üretilen en güncel test APK'sı. Kaynak commit: $GITHUB_SHA" --latest
          else
            gh release create native-latest IbrahimAI.apk --title "İbrahim AI Native - Latest" --notes "Otomatik üretilen en güncel test APK'sı. Kaynak commit: $GITHUB_SHA" --latest
          fi
